name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get
      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: Analyze
        # Existing info-level lints remain visible; warnings and errors fail CI.
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Test package
        run: flutter test --no-pub
      - name: Test example
        working-directory: example
        run: flutter test --no-pub
      - name: Test package in Chrome
        run: flutter test --no-pub --platform chrome
      - name: Test example in Chrome
        working-directory: example
        run: flutter test --no-pub --platform chrome

  android:
    name: Build Android example
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Configure Java for Flutter
        run: flutter config --jdk-dir="$JAVA_HOME"
      - run: flutter pub get
      - run: flutter build apk --debug --no-pub

  ios:
    name: Build iOS example
    needs: checks
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install iOS dependencies
        working-directory: example/ios
        # Runner images may use a different CocoaPods version than the lockfile.
        run: pod install
      - run: flutter build ios --debug --no-codesign --no-pub
